name: Release PR

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    name: Open or update release PR
    runs-on: blacksmith
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Open or update release PR
        shell: bash
        run: |
          fmt='%H %h %an (%(trailers:key=Co-authored-by,valueonly=true,separator=%x2C )): %s'
          # Commits already on production via `git cherry-pick -x` from main.
          picked=$(git log origin/production --grep='cherry picked from commit' --format=%b | sed -nE 's/.*\(cherry picked from commit ([0-9a-f]{40})\).*/\1/p')
          all=$(git log --first-parent origin/production..origin/main --pretty=format:"$fmt" | sed -E 's/ <[^>]*>//g; s/ \(\)//')
          commits=$(awk -v picked="$picked" 'BEGIN{split(picked,a,/[[:space:]]+/); for(i in a) if(a[i]!="") skip[a[i]]=1} !skip[$1]{sub(/^[^ ]+ /,""); print}' <<<"$all")
          already=$(awk -v picked="$picked" 'BEGIN{split(picked,a,/[[:space:]]+/); for(i in a) if(a[i]!="") skip[a[i]]=1} skip[$1]{sub(/^[^ ]+ /,""); print}' <<<"$all")
          if [ -z "$all" ]; then
            echo "production is up to date with main; nothing to release"
            exit 0
          fi

          prefix="Release $(date -u +%Y.%-m)."
          last=$(gh pr list --base production --head main --state merged --limit 1 --json title --jq '.[0].title')
          if [[ "$last" =~ ^"$prefix"([0-9]+)$ ]]; then
            n=$((BASH_REMATCH[1] + 1))
          else
            n=0
          fi
          title="${prefix}${n}"

          body=$(mktemp)
          {
            if [ -n "$commits" ]; then
              echo '```'
              echo "$commits"
              echo '```'
            else
              echo "Everything on main is already on production via hotfix; merging only reconciles history."
            fi
            if [ -n "$already" ]; then
              echo
              echo "Already on production (cherry-picked hotfix):"
              echo '```'
              echo "$already"
              echo '```'
            fi
          } > "$body"
          existing=$(gh pr list --base production --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file "$body"
          else
            gh pr create --base production --head main --title "$title" --body-file "$body"
          fi
